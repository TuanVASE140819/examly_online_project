services:
  postgres:
    image: postgres:16-alpine
    container_name: examly-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examly
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
