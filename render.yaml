# Render Blueprint: Web Service chỉ chạy API + Socket.IO. Giao diện chạy riêng trên Vercel.
# Database dùng Postgres bên ngoài (Neon): dán chuỗi kết nối vào DATABASE_URL khi tạo Blueprint.
services:
  - type: web
    name: cbrn-e
    runtime: node
    plan: free
    region: singapore
    # NODE_ENV=production làm npm ci bỏ devDependencies, nên phải --include=dev để có tsc, prisma.
    # Đồng bộ bảng ngay lúc build (gói free không có pre-deploy command) để lần khởi động sau
    # khi máy chủ ngủ dậy không phải chờ prisma; lỗi schema sẽ làm hỏng build thay vì làm sập dịch vụ.
    buildCommand: >-
      cd server && npm ci --include=dev && npx prisma generate && npm run build &&
      npx prisma db push --skip-generate
    startCommand: cd server && node dist/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Render đứng trước ứng dụng đúng 1 lớp proxy
      - key: TRUST_PROXY
        value: "1"
      # Giao diện chạy riêng trên Vercel gọi API và Socket.IO sang đây nên phải được CORS cho phép
      - key: FRONTEND_ORIGIN
        value: https://examly-online-project.vercel.app
